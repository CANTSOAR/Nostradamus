<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nostradamus — NJ Economic Atlas</title>
  <!-- Cesium widgets CSS must be a <link>, not a TS import (relative URLs break) -->
  <link rel="stylesheet" href="/cesiumStatic/Widgets/widgets.css" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body,
    #root {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    /* Move cesium-navigation compass + zoom controls to the left side */
    .compass {
      right: auto !important;
      left: 16px !important;
      top: 140px !important;
    }

    .navigation-controls {
      right: auto !important;
      left: 20px !important;
      top: 248px !important;
    }

    .distance-legend {
      right: auto !important;
      left: 16px !important;
      bottom: 36px !important;
    }
  </style>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
