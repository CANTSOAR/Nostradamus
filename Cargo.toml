[package]
name = "Nostradamus"
version = "0.1.0"
edition = "2024"

[dependencies]
csv = "1.4.0"
futures-util = "0.3.31"
rand = "0.10.0"
rayon = "1.11.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.49.0", features = ["full"] }
tokio-tungstenite = "0.28.0"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

